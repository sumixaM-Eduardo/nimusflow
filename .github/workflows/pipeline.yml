name: Pipeline CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nimusflow_user
          POSTGRES_PASSWORD: nimusflow_pass
          POSTGRES_DB: nimusflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          echo "RAW_CSV_PATH=data/raw/sales_sample.csv" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_NAME=nimusflow" >> .env
          echo "DB_USER=nimusflow_user" >> .env
          echo "DB_PASSWORD=nimusflow_pass" >> .env
          echo "DB_PORT=5432" >> .env

      - name: Create database
        run: PYTHONPATH=. python -c "from pipeline.database import create_table; create_table()"

      - name: Run tests
        run: PYTHONPATH=. pytest tests/
